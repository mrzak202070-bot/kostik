<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пазл для тебе ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; 
    min-height: 100vh; 
    display: flex; 
    justify-content: center;
    align-items: center; 
    padding: 20px; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ffe4ec, #fff7fb); 
    color: #3b2430;
  }
  .app { 
    width: min(850px, 100%); 
    text-align: center; 
  }
  h1 { 
    margin: 0 0 8px; 
    font-size: clamp(24px, 4vw, 36px); 
    color: #a85b7a;
  }
  p { 
    margin: 0 0 18px; 
    color: #765464; 
    font-size: 16px;
  }
  
  .game-container {
    position: relative;
    width: min(760px, 100%);
    aspect-ratio: 770 / 218;
    margin: 0 auto 20px;
  }

  .board {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3px;
    background: #fff;
    padding: 3px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(168, 91, 122, 0.15);
    overflow: hidden;
    position: relative;
    z-index: 1;
    transition: opacity 0.5s ease;
  }

  .tile {
    position: relative;
    border: none;
    padding: 0;
    cursor: pointer;
    min-width: 0;
    background-size: 400% 400%;
    border-radius: 4px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    outline: none;
  }

  .tile:hover {
    transform: scale(0.98);
    box-shadow: 0 0 8px rgba(168, 91, 122, 0.4);
  }

  .tile.selected {
    outline: 3px solid #ff4b82;
    z-index: 2;
    transform: scale(0.95);
  }

  .full-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    object-fit: contain;
    background: #fff;
    box-shadow: 0 0 30px rgba(255, 75, 130, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease, transform 0.8s ease;
    z-index: 2;
  }

  .full-image.visible {
    opacity: 1;
    transform: scale(1.02);
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 15px;
  }

  .btn {
    background: #a85b7a;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(168, 91, 122, 0.2);
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover {
    background: #8e4864;
    transform: translateY(-1px);
  }

  .win-message {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 12px;
    color: #a85b7a;
    font-size: 20px;
    font-weight: bold;
    animation: fadeIn 1s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="app">
  <h1>Пазл для тебе ❤️</h1>
  <p>Обирай два шматочки кліком, щоб поміняти їх місцями та зібрати послання!</p>

  <div class="game-container">
    <div class="board" id="board"></div>
    <img id="fullImage" class="full-image" src="photo.jpg" alt="Зібране зображення">
  </div>

  <div class="controls">
    <button class="btn" onclick="shuffleTiles()">Перемішати</button>
    <button class="btn" onclick="showHint()">Підказка</button>
  </div>

  <div class="win-message" id="winMessage">
    ✨ Пазл зібрано! Я тебе дуже люблю! ✨
  </div>
</div>

<script>
  const imgSrc = "photo.jpg";

  const rows = 4;
  const cols = 4;
  let tiles = [];
  let selectedTile = null;

  const board = document.getElementById('board');
  const fullImage = document.getElementById('fullImage');
  const winMessage = document.getElementById('winMessage');

  function initGame() {
    board.innerHTML = '';
    tiles = [];
    selectedTile = null;
    fullImage.classList.remove('visible');
    winMessage.style.display = 'none';
    board.style.opacity = '1';

    for (let i = 0; i < rows * cols; i++) {
      tiles.push(i);
    }

    shuffleArray(tiles);
    renderBoard();
  }

  function renderBoard() {
    board.innerHTML = '';
    tiles.forEach((correctIndex, currentIndex) => {
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.dataset.currentIndex = currentIndex;
      
      const x = (correctIndex % cols) * (100 / (cols - 1));
      const y = Math.floor(correctIndex / cols) * (100 / (rows - 1));
      
      tile.style.backgroundImage = `url("${imgSrc}")`;
      tile.style.backgroundPosition = `${x}% ${y}%`;

      tile.addEventListener('click', () => onTileClick(currentIndex));
      board.appendChild(tile);
    });
  }

  function onTileClick(index) {
    const tileElements = board.children;

    if (selectedTile === null) {
      selectedTile = index;
      tileElements[index].classList.add('selected');
    } else if (selectedTile === index) {
      tileElements[index].classList.remove('selected');
      selectedTile = null;
    } else {
      const temp = tiles[selectedTile];
      tiles[selectedTile] = tiles[index];
      tiles[index] = temp;

      tileElements[selectedTile].classList.remove('selected');
      selectedTile = null;

      renderBoard();
      checkWin();
    }
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function shuffleTiles() {
    initGame();
  }

  function showHint() {
    fullImage.classList.add('visible');
    setTimeout(() => {
      if (!checkWinState()) {
        fullImage.classList.remove('visible');
      }
    }, 1500);
  }

  function checkWinState() {
    return tiles.every((val, index) => val === index);
  }

  function checkWin() {
    if (checkWinState()) {
      setTimeout(() => {
        board.style.opacity = '0';
        fullImage.classList.add('visible');
        winMessage.style.display = 'block';
      }, 300);
    }
  }

  initGame();
</script>

</body>
</html>
